<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/flavicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cook for Everyone" />
  <title>crosspasta</title>
 </head>
 <body style="padding:16px;">
  <div style="max-width:800px; margin: 0 auto;">
   <form id="f" target="_blank">
    <div class="expanding-area"><pre><span></span><br></pre>
     <textarea name="text" placeholder="What's on your mind?"></textarea>
    </div>
   </form>
   <div style="display:flex; justify-content: space-between; margin: 16px 0;">
    <span>
     <!-- TODO: emoji selector -->
     <!-- TODO: copy to clipbaord -->
    </span>

    <span style="display:flex; align-items:center; gap:16px;">
     <span id="char-count" style="font-size:24px; font-weight: 700;"></span>
     <button id="post-all" type="button" disabled
      style="border-radius:calc(infinity*1px); font-weight: 800; font-size:16px; padding: 12px 24px; background-color:var(--primary)"
     >
      Post all
     </button>
    </span>
   </div>
   <div style="display:flex; flex-direction:column; gap:16px;">
    <div class="platform-row">
     <button type="submit" form="f" formaction="https://twitter.com/intent/tweet" id="twitter">𝕏 twitter</button>
     <input type="checkbox" checked>
    </div>
    <div class="platform-row">
     <button type="submit" form="f" formaction="https://bsky.app/intent/compose" id="bluesky">🦋 bluesky</button>
     <input type="checkbox" checked>
    </div>

    <div class="platform-row">
     <!-- tumblr requires a source url for their post composer to work -->
     <button type="submit" form="f" formaction="https://www.tumblr.com/share/tool?posttype=text&title=&canonicalUrl=https%3A%2F%2Fcrosspasta.com&content="
      id="tumblr"
      disabled
     >
      🥃 tumblr
     </button>
     <input type="checkbox">
    </div>

    <div class="platform-row">
     <button type="submit" form="f" formaction="https://s2f.kytta.dev/?instance=https%3A%2F%2Fmastodon.xyz" id="mastodon">🐘 mastodon</button>
     <input type="checkbox">
    </div>
   </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
 </body>
</html>
